<router-outlet></router-outlet>

<!-- Floating Toast Notifications (Bottom Right Corner, Auto-hide 15s) -->
<div class="fixed bottom-5 right-5 z-[99999] flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0">
  @for (toast of notifService.activeToasts(); track toast.id) {
    <div
      class="toast-card pointer-events-auto flex items-start gap-3 p-4 rounded-xl border shadow-2xl backdrop-blur-md bg-white/95 dark:bg-slate-900/95 border-slate-200/80 dark:border-slate-800 text-slate-800 dark:text-slate-100"
    >
      <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-sm font-semibold mt-0.5">
        🔔
      </div>
      <div class="flex-1 min-w-0 pr-1">
        <h4 class="text-sm font-semibold leading-tight tracking-tight text-slate-900 dark:text-white truncate">
          {{ toast.title }}
        </h4>
        <p class="text-xs text-slate-600 dark:text-slate-300 mt-1 leading-relaxed line-clamp-3">
          {{ toast.message }}
        </p>
      </div>
      <button
        type="button"
        (click)="notifService.dismissToast(toast.id)"
        class="flex-shrink-0 -mr-1 -mt-1 p-1 rounded-md text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        title="Dismiss"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
