<div class="space-y-2 w-full">
  @if (label) {
    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 text-center mb-2">
      {{ label }}
      @if (required) {
        <span class="text-rose-500 ml-0.5">*</span>
      }
    </label>
  }

  <div class="flex items-center justify-center gap-2 sm:gap-3 w-full my-1" (paste)="onPaste($event)">
    @for (digit of digits(); track $index) {
      <input
        #otpBox
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="1"
        [value]="digit"
        [disabled]="disabled"
        (input)="onInput($index, $event)"
        (keydown)="onKeyDown($index, $event)"
        (focus)="onFocus($index)"
        class="w-11 h-13 sm:w-13 sm:h-14 text-center font-bold text-xl sm:text-2xl rounded-2xl border-2 transition-all duration-150 outline-none select-none"
        [ngClass]="[
          disabled ? 'bg-slate-100 dark:bg-slate-800/50 text-slate-400 opacity-60 cursor-not-allowed border-slate-200 dark:border-slate-700' : '',
          error
            ? 'border-rose-500 bg-rose-50/40 dark:bg-rose-950/30 text-rose-600 dark:text-rose-400'
            : activeIndex() === $index
              ? 'border-[#2A65F6] bg-white dark:bg-[#202226] text-slate-900 dark:text-white ring-4 ring-[#2A65F6]/15 shadow-sm'
              : digit
                ? 'border-[#2A65F6]/60 bg-blue-50/30 dark:bg-[#202226] text-slate-900 dark:text-white'
                : 'border-slate-200 dark:border-slate-700 bg-slate-50/60 dark:bg-[#202226] text-slate-900 dark:text-white hover:border-slate-300 dark:hover:border-slate-600'
        ]"
        aria-label="OTP Digit Input"
      />
    }
  </div>

  @if (error) {
    <p class="text-xs text-rose-500 dark:text-rose-400 text-center font-medium mt-1.5 animate-fade-in">
      {{ error }}
    </p>
  }
</div>
