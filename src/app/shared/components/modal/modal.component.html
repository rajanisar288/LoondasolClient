@if (isOpen) {
  <div class="fixed inset-0 z-50 overflow-hidden flex items-center justify-center p-3 sm:p-4 md:p-6">
    <div
      class="fixed inset-0 bg-slate-900/50 dark:bg-black/75 modal-backdrop-anim"
      (click)="onBackdropClick()"
    ></div>
    <div
      class="relative w-full max-h-[92vh] sm:max-h-[90vh] flex flex-col rounded-[8px] bg-white dark:bg-[#202226] text-left shadow-2xl border border-slate-200/80 dark:border-slate-800 modal-panel-anim z-10"
      (scroll)="onPanelScroll($event)"
      [ngClass]="resolvedWidthClass()"
      role="dialog"
      aria-modal="true"
    >
      @if (splitLayout) {
        <div class="grid grid-cols-1 lg:grid-cols-12 flex-1 overflow-hidden min-h-0">
          <div class="lg:col-span-7 p-6 sm:p-7 flex flex-col justify-between overflow-y-auto min-h-0 overscroll-contain">
            <div>
              <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-semibold text-slate-900 dark:text-white tracking-tight">
                  {{ title }}
                </h3>
                <button
                  type="button"
                  (click)="close()"
                  class="lg:hidden rounded-[8px] p-1.5 text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-700 dark:hover:text-slate-200 transition-colors"
                  aria-label="Close modal"
                >
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              </div>
              <div class="overflow-y-auto pr-1">
                <ng-content></ng-content>
              </div>
            </div>
          </div>
          <div class="lg:col-span-5 bg-slate-50/70 dark:bg-[#27292d] border-t lg:border-t-0 lg:border-l border-slate-100 dark:border-slate-800 p-6 sm:p-7 flex flex-col justify-between rounded-b-[8px] lg:rounded-bl-none lg:rounded-r-[8px] overflow-y-auto min-h-0">
            <div class="hidden lg:flex justify-end mb-2">
              <button
                type="button"
                (click)="close()"
                class="rounded-[8px] p-1.5 text-slate-400 hover:bg-slate-200/60 dark:hover:bg-slate-800 hover:text-slate-700 dark:hover:text-slate-200 transition-colors"
                aria-label="Close modal"
              >
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
            <div class="flex-1">
              <ng-content select="[modal-aside]"></ng-content>
            </div>
          </div>
        </div>
      } @else {
        <div class="flex items-center justify-between px-6 pt-5 pb-4 border-b border-slate-100 dark:border-slate-800/80 shrink-0">
          <h3 class="text-base font-semibold text-slate-900 dark:text-white tracking-tight truncate pr-4">
            {{ title }}
          </h3>
          <button
            type="button"
            (click)="close()"
            class="rounded-[8px] p-1.5 text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-700 dark:hover:text-slate-200 transition-colors focus:outline-none"
            aria-label="Close modal"
          >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div class="px-6 py-5 overflow-y-auto flex-1 min-h-0 overscroll-contain">
          <ng-content></ng-content>
        </div>
        <ng-content select="[modal-footer]"></ng-content>
        @if (showFooter) {
          <div class="px-6 py-4 bg-slate-50/60 dark:bg-[#27292d]/60 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between gap-3 rounded-b-[8px] shrink-0">
            <div>
              @if (showResetButton) {
                <app-button
                  type="button"
                  variant="ghost"
                  (btnClick)="resetAction.emit()"
                >
                  {{ resetLabel }}
                </app-button>
              }
            </div>
            <div class="flex items-center gap-2.5 ml-auto">
              <app-button
                type="button"
                variant="secondary"
                [disabled]="primaryLoading"
                (btnClick)="onSecondary()"
              >
                {{ secondaryLabel }}
              </app-button>
              <app-button
                type="button"
                variant="primary"
                [loading]="primaryLoading"
                [disabled]="primaryDisabled"
                (btnClick)="primaryAction.emit()"
              >
                {{ primaryLabel }}
              </app-button>
            </div>
          </div>
        }
      }
    </div>
  </div>
}
